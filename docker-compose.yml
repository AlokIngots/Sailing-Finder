# Sailing Finder — app + Postgres.
# Same style as the existing n8n stack on this VPS.
#
# The app port is NOT published to the internet. The reverse proxy already on
# the box terminates HTTPS for sailing.alokindia.com and forwards to this
# container over the shared proxy network.
#
# Bring up:   docker compose up -d        (via ./deploy.sh only, for live)
# Logs:       docker compose logs -f app
# Rollback:   docker compose down && git checkout <previous-tag> && ./deploy.sh

services:
  db:
    image: postgres:16-alpine
    container_name: sailing_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - sailing_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  app:
    build:
      # Context is the repo root so the image can include frontend/ too.
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: sailing_app
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Asia/Kolkata}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Customer documents (PL / CI / VGM). Gitignored, lives outside the image.
      - sailing_uploads:/app/uploads
      # Read-only mount of the Google service-account key. The file stays on the
      # VPS filesystem and is never committed. Path set by GOOGLE_KEY_HOST_PATH.
      - ${GOOGLE_KEY_HOST_PATH}:/run/secrets/google-key.json:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||8080)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - internal
      # TODO(vps): uncomment once the reverse proxy in use is confirmed.
      # - proxy
    # TODO(vps): if the proxy is Traefik, labels go here instead of an Nginx/Caddy
    # site file. Left out until the proxy is confirmed — see README "Front door".
    #
    # Temporary local-only access while the proxy is not wired up yet.
    # Binds to loopback so nothing is exposed publicly.
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"

volumes:
  sailing_db_data:
  sailing_uploads:

networks:
  internal:
    driver: bridge
  # TODO(vps): set `name:` to the existing proxy network (the one n8n is on).
  # proxy:
  #   external: true
  #   name: CHANGE_ME
