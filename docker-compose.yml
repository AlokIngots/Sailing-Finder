# Sailing Finder — FastAPI app (with the React build baked in) + Postgres.
# Same style as the existing n8n stack on this VPS.
#
# The app port is NOT published to the internet. The reverse proxy already on
# the box terminates HTTPS for sailing.alokindia.com and forwards to this
# container over the shared proxy network.
#
# Bring up:   ./deploy.sh              (the only way to go live)
# Logs:       docker compose logs -f app
# Rollback:   git checkout <deploy tag> && ./deploy.sh

services:
  db:
    image: postgres:16-alpine
    container_name: sailing_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - sailing_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  app:
    build:
      # Context is the repo root: the image builds frontend/ and runs backend/.
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: sailing_app
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: production
      TZ: ${TZ:-Asia/Kolkata}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Customer documents (PL / CI / VGM). Gitignored, outside the image.
      - sailing_uploads:/app/uploads
      # Google service-account key, read-only. The file stays on the VPS
      # filesystem and is never committed.
      - ${GOOGLE_KEY_HOST_PATH}:/run/secrets/google-key.json:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal
      # TODO(vps): uncomment once the reverse proxy in use is confirmed.
      # - proxy
    # TODO(vps): if the proxy is Traefik, its labels go here instead of an
    # Nginx/Caddy site file. Left out until the proxy is confirmed.
    #
    # Temporary loopback-only binding while the proxy is not wired up. Nothing
    # is exposed publicly by this.
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"

  # Sync + cleanup on a schedule. Same image, different command, so the jobs can
  # never drift from the app's code.
  jobs:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: sailing_jobs
    restart: unless-stopped
    command: ["python", "-m", "jobs.daily", "--schedule"]
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: production
      TZ: ${TZ:-Asia/Kolkata}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${GOOGLE_KEY_HOST_PATH}:/run/secrets/google-key.json:ro
    networks:
      - internal

volumes:
  sailing_db_data:
  sailing_uploads:

networks:
  internal:
    driver: bridge
  # TODO(vps): set `name:` to the existing proxy network (the one n8n is on).
  # proxy:
  #   external: true
  #   name: CHANGE_ME
