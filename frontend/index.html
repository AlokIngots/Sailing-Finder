<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#000C2E" />
    <title>Sailing Finder</title>

    <!--
      Inter / Inter Tight, exactly as reference/Index.html loads them. The
      screen leans on them: .dt .v and every heading use the display face, and
      substituting a system font shifts the layout.

      This is a runtime call to fonts.googleapis.com. Worth self-hosting via
      @fontsource later so the app has no external dependency at all — but that
      is a new npm package, so it waits for APPROVED and its own branch.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700&family=Inter:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <noscript>Sailing Finder needs JavaScript switched on.</noscript>
    <!--
      Empty on purpose. No schedule data is ever rendered into this file — it is
      fetched from /api/schedule after a successful login, which is what the old
      <?!= rows ?> injection did before the login gate existed.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
